<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NotebookLM RAG</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar" aria-label="Documents">
        <div class="brand">
          <div>
            <h1>NotebookLM RAG</h1>
            <p id="serviceStatus">Checking service...</p>
          </div>
        </div>

        <form id="uploadForm" class="upload-panel">
          <label for="documentInput">Upload document</label>
          <input id="documentInput" name="document" type="file" accept=".pdf,.txt,application/pdf,text/plain" />
          <button type="submit">Index document</button>
          <p id="uploadStatus" class="status"></p>
        </form>

        <section class="document-section">
          <div class="section-title">
            <h2>Documents</h2>
            <button id="refreshDocuments" type="button">Refresh</button>
          </div>
          <div id="documentList" class="document-list"></div>
        </section>
      </aside>

      <section class="chat-area" aria-label="Chat">
        <header class="chat-header">
          <div>
            <p class="eyebrow">Selected document</p>
            <h2 id="selectedDocumentName">No document selected</h2>
          </div>
          <div id="selectedDocumentMeta" class="meta-pill">0 chunks</div>
        </header>

        <div id="messages" class="messages">
          <article class="message assistant">
            <p>Upload a PDF or text file, then ask a question about its contents.</p>
          </article>
        </div>

        <form id="questionForm" class="question-bar">
          <input id="questionInput" type="text" placeholder="Ask about the selected document" autocomplete="off" />
          <button type="submit">Ask</button>
        </form>
      </section>

      <aside class="sources" aria-label="Retrieved sources">
        <div class="section-title">
          <h2>Sources</h2>
          <span id="sourceCount">0</span>
        </div>
        <div id="sourcesList" class="sources-list"></div>
      </aside>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
